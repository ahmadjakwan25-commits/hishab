<style>
:root{--bg:#f1f5f2;--inc:#1f7a4d;--card:#fff;--ink:#14261c;--mut:#5d7066;--g:#1f7a4d;--g2:#17603c;--line:#dbe5de;--red:#c0392b;--amb:#b7791f;--blue:#2b6cb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Baloo Da 2','SutonnyOMJ','Hind Siliguri','Noto Sans Bengali','Kalpurush',sans-serif;font-size:16px;line-height:1.5;padding-bottom:90px}
header{background:var(--g2);color:#fff;padding:18px 16px 30px;text-align:center}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:620px;margin:-38px auto 0;padding:0 14px}
.bal{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);text-align:center}
.bal small{color:var(--mut)}
.bal .big{font-size:34px;font-weight:700;color:var(--g)}
.bal .big.neg{color:var(--red)}
.row3{display:flex;gap:8px;margin-top:10px}
.row3 div{flex:1;background:var(--bg);border-radius:10px;padding:6px;font-size:13px;color:var(--mut)}
.row3 b{display:block;font-size:15px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;font:inherit;color:var(--ink);cursor:pointer}
.tile span{display:block;font-size:28px}
.tile b{font-weight:600}
.tile:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:16px 0 10px}
.top h2{margin:0;font-size:20px}
.back{white-space:nowrap;font-size:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--mut);display:block}
.amt{font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer;padding:4px 8px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:14px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:5}
#calc{position:fixed;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(290px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:5;display:none}
#calc.on{display:block}
#disp{background:var(--bg);border-radius:10px;padding:8px 10px;text-align:right;min-height:58px;word-break:break-all}
#disp small{display:block;color:var(--mut);min-height:20px}
#disp b{font-size:26px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.keys button{padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.keys .op{background:var(--g);color:#fff;border-color:var(--g)}
.keys .wide{grid-column:span 2}
@media(min-width:900px){#calc{display:block;right:max(12px,calc(50% - 560px));bottom:auto;top:110px}#fab{display:none}}

header{position:relative}
#mb{position:absolute;left:10px;top:12px;width:42px;height:42px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
#dov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}#dov.on{display:block}

.av{width:78px;height:78px;border-radius:50%;background:var(--g) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto;border:3px solid var(--line)}
.cn{font-size:18px;font-weight:700;margin-top:8px}
.mi{display:flex;gap:10px;align-items:center;width:100%;padding:12px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;border-radius:10px;cursor:pointer;text-align:left}

.lbox{width:100%;max-width:320px;text-align:center}.lbox h2{color:var(--g)}

/* ---- হালকা মিশ্র রং: ক্যালেন্ডার ---- */
.wk{background:rgba(var(--c),.16);color:var(--ink);filter:none;font-weight:700}
.cd{background:rgba(var(--c),.07);border:1px solid rgba(var(--c),.22)}
.cd small{color:var(--mut);filter:none;font-weight:500}
.cd.ev{background:rgba(var(--ec,240,170,40),.2);border:1px solid rgba(var(--ec,240,170,40),.75);box-shadow:none}
.cd.ev small{color:var(--ink);font-weight:600}
.cd.td{background:rgba(26,134,184,.15);border:2px solid #1a86b8;color:var(--ink)}
.cd.td small{color:#1a86b8;font-weight:700;filter:none}
.cd.frd b,.cd.td.frd b{color:#c0504a}
.item.ev2{background:rgba(var(--ec),.1);border:1px solid rgba(var(--ec),.28);border-left:4px solid rgba(var(--ec),.75);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item.ev2:last-child{margin-bottom:0}
/* ---- ছোট ও সাজানো উপরের হেডার ---- */
header{background:linear-gradient(135deg,var(--g2),var(--g));padding:9px 56px 13px;overflow:hidden;border-bottom:3px solid #d9b34a;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* ---- ফিরে যান বাটন: হালকা রঙিন ---- */

 var x=off;add('xref\n0 '+(3*N+3)+'\n0000000000 65535 f \n');

{t:'ফজরের পরের দোয়া',ar:'اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا',bn:'হে আল্লাহ! আমি আপনার কাছে উপকারী ইলম, পবিত্র রিযিক ও কবুলযোগ্য আমল চাই।',s:'সুনান ইবনু মাজাহ'},
{t:'যিকির, শুকরিয়া ও ভালো ইবাদতের সাহায্য চাওয়া',ar:'اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ',bn:'হে আল্লাহ! আপনার যিকির, শুকরিয়া ও সুন্দরভাবে ইবাদত করতে আমাকে সাহায্য করুন।',s:'সুনান আবু দাউদ, নাসায়ী'},
{t:'মসজিদে প্রবেশের দোয়া',ar:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ',bn:'হে আল্লাহ! আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন।',s:'সহীহ মুসলিম'},
{t:'মসজিদ থেকে বের হওয়ার দোয়া',ar:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ',bn:'হে আল্লাহ! আমি আপনার অনুগ্রহ প্রার্থনা করি।',s:'সহীহ মুসলিম'},
{t:'ঘুমানোর দোয়া',ar:'اللَّهُمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا',bn:'হে আল্লাহ! আপনার নামেই আমি মরি (ঘুমাই) এবং বাঁচি (জাগি)।',s:'সহীহ বুখারী'},
{t:'ঘুম থেকে ওঠার দোয়া',ar:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',bn:'সমস্ত প্রশংসা আল্লাহর, যিনি আমাদের মৃত্যুর (ঘুমের) পর জীবিত করেছেন, আর তাঁর কাছেই ফিরে যেতে হবে।',s:'সহীহ বুখারী'},
{t:'খাওয়ার পরের দোয়া',ar:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ',bn:'সমস্ত প্রশংসা আল্লাহর, যিনি আমাকে এটি খাওয়ালেন এবং আমার কোনো শক্তি ও সামর্থ্য ছাড়াই এটি রিযিক দিলেন।',s:'সুনান আবু দাউদ, জামে তিরমিযী'},
{t:'বাড়ি থেকে বের হওয়ার দোয়া',ar:'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',bn:'আল্লাহর নামে (বের হলাম), আল্লাহর ওপর ভরসা করলাম। আল্লাহর সাহায্য ছাড়া কোনো উপায় ও শক্তি নেই।',s:'সুনান আবু দাউদ, জামে তিরমিযী'},
{t:'রোগীর জন্য আরোগ্যের দোয়া',ar:'اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا',bn:'হে আল্লাহ, মানুষের রব! কষ্ট দূর করে দিন। আরোগ্য দান করুন, আপনিই আরোগ্যদানকারী। আপনার আরোগ্য ছাড়া কোনো আরোগ্য নেই; এমন আরোগ্য দিন যা কোনো রোগ অবশিষ্ট রাখে না।',s:'সহীহ বুখারী ও মুসলিম'},
{t:'বিপদে পড়লে',ar:'إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا',bn:'নিশ্চয়ই আমরা আল্লাহর জন্য এবং তাঁরই কাছে ফিরে যাব। হে আল্লাহ! আমার বিপদে আমাকে প্রতিদান দিন এবং এর চেয়ে উত্তম কিছু দান করুন।',s:'সহীহ মুসলিম'}

sondha:[

{tg:'সকাল',t:'সকালের রাজত্বের স্বীকৃতি',ar:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',bn:'আমরা সকালে উপনীত হলাম এবং আল্লাহর রাজত্বও সকালে উপনীত হলো। সমস্ত প্রশংসা আল্লাহর। আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি একক, তাঁর কোনো শরিক নেই। রাজত্ব ও প্রশংসা তাঁরই এবং তিনি সবকিছুর ওপর ক্ষমতাবান।',s:'সহীহ মুসলিম'},
{tg:'সন্ধ্যা',t:'সন্ধ্যার রাজত্বের স্বীকৃতি',ar:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',bn:'আমরা সন্ধ্যায় উপনীত হলাম এবং আল্লাহর রাজত্বও সন্ধ্যায় উপনীত হলো। সমস্ত প্রশংসা আল্লাহর। আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি একক, তাঁর কোনো শরিক নেই। রাজত্ব ও প্রশংসা তাঁরই এবং তিনি সবকিছুর ওপর ক্ষমতাবান।',s:'সহীহ মুসলিম'},
{tg:'সকাল',t:'সকালে আল্লাহর অনুগ্রহের স্বীকৃতি',ar:'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ',bn:'হে আল্লাহ! আপনার অনুগ্রহে আমরা সকালে উপনীত হলাম, আপনার অনুগ্রহে সন্ধ্যায় উপনীত হই। আপনার ইচ্ছায় আমরা বাঁচি ও মরি, আর আপনার কাছেই পুনরুত্থান।',s:'জামে তিরমিযী'},
{tg:'সন্ধ্যা',t:'সন্ধ্যায় আল্লাহর অনুগ্রহের স্বীকৃতি',ar:'اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ',bn:'হে আল্লাহ! আপনার অনুগ্রহে আমরা সন্ধ্যায় উপনীত হলাম, আপনার অনুগ্রহে সকালে উপনীত হই। আপনার ইচ্ছায় আমরা বাঁচি ও মরি, আর আপনার কাছেই প্রত্যাবর্তন।',s:'জামে তিরমিযী'},
{tg:'দুই বেলা',t:'সাইয়্যিদুল ইস্তিগফার',ar:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',bn:'হে আল্লাহ! আপনি আমার রব, আপনি ছাড়া কোনো ইলাহ নেই। আপনি আমাকে সৃষ্টি করেছেন, আমি আপনার বান্দা। আমি যথাসাধ্য আপনার অঙ্গীকার ও প্রতিশ্রুতির ওপর আছি। আমি যা করেছি তার অনিষ্ট থেকে আপনার আশ্রয় চাই। আমার ওপর আপনার নিয়ামত স্বীকার করছি এবং আমার গুনাহও স্বীকার করছি। অতএব আমাকে ক্ষমা করুন; আপনি ছাড়া গুনাহ ক্ষমা করার কেউ নেই।',s:'সহীহ বুখারী'},
{tg:'দুই বেলা',t:'কোনো ক্ষতি স্পর্শ না করার দোয়া',ar:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',n:'৩ বার',bn:'আল্লাহর নামে, যাঁর নামের সঙ্গে আসমান ও জমিনের কোনো কিছুই ক্ষতি করতে পারে না। তিনি সর্বশ্রোতা, সর্বজ্ঞ।',s:'সুনান আবু দাউদ, জামে তিরমিযী'},

function qRef(ref,cb){
 var c=lsGet('mf-qr:'+ref);if(c){try{cb(JSON.parse(c));return}catch(e){}}
 Promise.all([jget([QAPI+'ayah/'+ref+'/quran-uthmani']),jget([QAPI+'ayah/'+ref+'/bn.bengali'])]).then(function(r){var v=[r[0].data.text,r[1].data.text];try{lsSet('mf-qr:'+ref,JSON.stringify(v))}catch(e){}cb(v)}).catch(function(){cb(null)});
}
function dcCnt(k){var n=(DCI[k]||[]).length;((CT&&CT.duas)||[]).forEach(function(x){if((x.topic||'').trim()===DC[k].t)n++});return n}
function dcCards(){
 var h='<div class="dcg">';
 Object.keys(DC).forEach(function(k){var d=DC[k];h+='<button class="dcc" style="--c:'+d.c+'" data-h="dc:'+k+'"><span class="di">'+d.ic+'</span><span style="flex:1"><b>'+d.t+'</b><small>'+d.d+' · '+bd(dcCnt(k))+' টি</small></span><span class="qc">›</span></button>'});
 return h+'</div>';
}
function dcOther(a){var ts=Object.keys(DC).map(function(k){return DC[k].t});return a.filter(function(x){return ts.indexOf((x.topic||'').trim())<0})}
function dcItem(x,i){
 var h='<details class="dci fi"><summary>'+(x.tg?'<span class="dtg'+(x.tg==='সন্ধ্যা'?' ev':x.tg==='দুই বেলা'?' bt':'')+'">'+x.tg+'</span>':'')+esc(x.t||'')+(x.n?' <small style="color:var(--mut)">· '+x.n+'</small>':'')+'</summary>',src=x.s;
 if(x.q){var p=x.q.split(':');h+='<div id="dq-'+i+'" class="empty">লোড হচ্ছে…</div>';if(!src)src='কুরআন, সূরা '+SN[+p[0]-1]+' · আয়াত '+bd(p[1])}
 else{if(x.ar)h+='<div class="ar" style="font-size:'+(mfs().qfs||26)+'px">'+esc(x.ar)+'</div>';if(x.bn)h+='<div class="tr">'+esc(x.bn)+'</div>'}
 if(x.sr)h+='<div style="margin:6px 0">'+x.sr.map(function(n){return '<button class="chip" data-h="sr:'+n+'">সূরা '+SN[n-1]+' ↗</button>'}).join(' ')+'</div>';
 if(src)h+='<small style="color:var(--mut)">'+esc(src)+'</small>';
 return h+'</details>';
}
function dcPaint(extra){
 var k=duaK,L=(DCI[k]||[]).concat(extra||[]),b=$('dcl');if(!b||view!=='duac')return;
 var h='';L.forEach(function(x,i){h+=dcItem(x,i)});
 b.innerHTML=h||'<div class="empty">কিছু নেই</div>';
 L.forEach(function(x,i){if(x.q)qRef(x.q,function(v){var e=$('dq-'+i);if(!e||view!=='duac'||duaK!==k)return;e.className='';e.innerHTML=v?'<div class="ar" style="font-size:'+(mfs().qfs||26)+'px">'+esc(v[0])+'</div><div class="tr">'+esc(v[1])+'</div>':mfOff()})});
}

}

/* কতজন দেখেছে: বিনামূল্যের কাউন্টার সার্ভিস, প্রতি ডিভাইস থেকে প্রতি নোটিফিকেশনে একবার */
var NVU='https://abacus.jasoncameron.dev',NVS='almiftah-notif-v1';
function nvRun(a){
 a.forEach(function(x){
  var id=x.id||0,k=NVU+'/%s/'+NVS+'/n'+id;
  if(ghTok()){
   fetch(k.replace('%s','get')).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){var e=document.querySelector('.nvc[data-nid="'+id+'"]');if(e)e.textContent='👁 '+bd(j.value||0)+' জন দেখেছেন'}).catch(function(){var e=document.querySelector('.nvc[data-nid="'+id+'"]');if(e)e.textContent='👁 সংখ্যা আনা যায়নি (ইন্টারনেট দেখুন)'});
   return}
  if(lsGet('mf-nv'+id)||!id)return;
  fetch(k.replace('%s','hit')).then(function(r){if(r.ok)lsSet('mf-nv'+id,'1')}).catch(function(){});
 });
}
function notifInit(){loadContent(function(c){
 var a=(c.notifs||[]).slice().sort(function(x,y){return (y.id||0)-(x.id||0)}),seen=+lsGet('mf-nseen')||0,b=$('nlst'),h='';
 a.forEach(function(x){var nw=(x.id||0)>seen;h+='<div class="item'+(nw?' nw':'')+'" style="align-items:flex-start"><div style="flex:1"><b>'+(nw?'🔴 ':'')+esc(x.title||'')+'</b><small>'+esc(x.date||'')+'</small>'+(ghTok()?'<small class="nvc" data-nid="'+(x.id||0)+'" style="display:block;color:var(--g2);font-weight:600">👁 গণনা হচ্ছে…</small>':'')+(x.text?'<div class="note">'+esc(x.text)+'</div>':'')+'</div></div>'});
 if(view!=='notif')return;
 if(b)b.innerHTML=h||'<div class="empty">এখনো কোনো নোটিফিকেশন নেই</div>';nvRun(a);
 var mx=a.reduce(function(m,x){return Math.max(m,x.id||0)},0);if(mx>seen)lsSet('mf-nseen',String(mx));nbUpdate();
})}
