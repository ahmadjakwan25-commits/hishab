<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f2;--inc:#1f7a4d;--card:#fff;--ink:#14261c;--mut:#5d7066;--g:#1f7a4d;--g2:#17603c;--line:#dbe5de;--red:#c0392b;--amb:#b7791f;--blue:#2b6cb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--inc:#3fae77;--card:#182a20;--ink:#e8f1ea;--mut:#9bb1a3;--g:#3fae77;--g2:#2d8a5b;--line:#2a4234;--red:#ef7a6c;--amb:#e0b050;--blue:#6aa7e8}}
:root[data-theme="dark"]{--bg:#0f1a14;--inc:#3fae77;--card:#182a20;--ink:#e8f1ea;--mut:#9bb1a3;--g:#3fae77;--g2:#2d8a5b;--line:#2a4234;--red:#ef7a6c;--amb:#e0b050;--blue:#6aa7e8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',sans-serif;font-size:16px;line-height:1.5;padding-bottom:90px}
header{background:var(--g2);color:#fff;padding:18px 16px 30px;text-align:center}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:620px;margin:-38px auto 0;padding:0 14px}
.bal{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);text-align:center}
.bal small{color:var(--mut)}
.bal .big{font-size:34px;font-weight:700;color:var(--g)}
.bal .big.neg{color:var(--red)}
.row3{display:flex;gap:8px;margin-top:10px}
.row3 div{flex:1;background:var(--bg);border-radius:10px;padding:6px;font-size:13px;color:var(--mut)}
.row3 b{display:block;font-size:15px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;font:inherit;color:var(--ink);cursor:pointer}
.tile span{display:block;font-size:28px}
.tile b{font-weight:600}
.tile:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.top h2{margin:0;font-size:20px}
.back{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--mut);display:block}
.amt{font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer;padding:4px 8px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:14px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:5}
#calc{position:fixed;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(290px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:5;display:none}
#calc.on{display:block}
#disp{background:var(--bg);border-radius:10px;padding:8px 10px;text-align:right;min-height:58px;word-break:break-all}
#disp small{display:block;color:var(--mut);min-height:20px}
#disp b{font-size:26px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.keys button{padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
.keys .op{background:var(--g);color:#fff;border-color:var(--g)}
.keys .wide{grid-column:span 2}
@media(min-width:900px){#calc{display:block;right:max(12px,calc(50% - 560px));bottom:auto;top:110px}#fab{display:none}}
.ph{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}#prev{width:96px;height:96px;margin-top:8px}.tile.wide{grid-column:span 2;margin-top:10px}.sum.gi b{color:var(--inc)}.sum.re b{color:var(--red)}.cg,.cr{font-style:normal}.cg{color:var(--inc)}.cr{color:var(--red)}.led{border-left-width:5px}.led.gi{border-left-color:var(--inc)}.led.re{border-left-color:var(--red)}.led .lh{font-size:17px}.led.gi .lh,.led.gi .amt{color:var(--inc)}.led.re .lh,.led.re .amt{color:var(--red)}.tot{border-top:2px solid var(--line);font-size:17px;margin-top:4px}.led.gi .tot b{color:var(--inc)}.led.re .tot b{color:var(--red)}:root[data-accent="blue"]{--g:#2b6cb0;--g2:#1f4f86}:root[data-accent="purple"]{--g:#6b46c1;--g2:#553c9a}:root[data-accent="orange"]{--g:#c05621;--g2:#9c4221}:root[data-accent="rose"]{--g:#be185d;--g2:#9d174d}@media(prefers-color-scheme:dark){:root[data-accent="blue"]:not([data-theme="light"]){--g:#6aa7e8;--g2:#3b82c4}:root[data-accent="purple"]:not([data-theme="light"]){--g:#a78bfa;--g2:#7c5ccc}:root[data-accent="orange"]:not([data-theme="light"]){--g:#f0a060;--g2:#d97a2e}:root[data-accent="rose"]:not([data-theme="light"]){--g:#f472b6;--g2:#db2777}}:root[data-accent="blue"][data-theme="dark"]{--g:#6aa7e8;--g2:#3b82c4}:root[data-accent="purple"][data-theme="dark"]{--g:#a78bfa;--g2:#7c5ccc}:root[data-accent="orange"][data-theme="dark"]{--g:#f0a060;--g2:#d97a2e}:root[data-accent="rose"][data-theme="dark"]{--g:#f472b6;--g2:#db2777}
header{position:relative}
#mb{position:absolute;left:10px;top:12px;width:42px;height:42px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
#dov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}#dov.on{display:block}
#drw{position:fixed;top:0;left:0;bottom:0;width:min(290px,84%);background:var(--card);z-index:20;transform:translateX(-105%);transition:transform .2s;padding:calc(env(safe-area-inset-top,0px) + 18px) 12px 14px;overflow:auto;box-shadow:4px 0 20px rgba(0,0,0,.3)}
#drw.on{transform:none}
#dtop{text-align:center;padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.avb{background:none;border:0;padding:0;cursor:pointer}
.av{width:78px;height:78px;border-radius:50%;background:var(--g) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto;border:3px solid var(--line)}
.cn{font-size:18px;font-weight:700;margin-top:8px}
.mi{display:flex;gap:10px;align-items:center;width:100%;padding:12px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;border-radius:10px;cursor:pointer;text-align:left}
.mi:hover{background:var(--bg)}.mi[hidden]{display:none}
.sw{display:flex;gap:10px;margin-top:8px}.swb{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swb.on{border-color:var(--ink)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}#lock[hidden]{display:none}
.lbox{width:100%;max-width:320px;text-align:center}.lbox h2{color:var(--g)}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}.note{white-space:pre-wrap;margin-top:4px;word-break:break-word}.cmp{padding:10px;border-radius:10px;background:var(--bg);text-align:center;font-weight:700;margin-top:8px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:60;max-width:90%;text-align:center}</style>
</head>
<body>
<header><button id="mb" aria-label="মেনু">☰</button><h1>হিসাবের খাতা</h1><p id="hsub">আয়–ব্যয়ের সহজ হিসাব</p></header>
<main id="app"></main>
<div id="dov"></div>
<nav id="drw" aria-label="মেনু"><div id="dtop"></div>

<input type="file" id="avf" accept="image/*" hidden>
<div id="lock" hidden><div class="lbox"><h2>🔒 হিসাবের খাতা</h2><input type="password" id="lpw" placeholder="পাসওয়ার্ড" autocomplete="off"><button class="btn" id="lgo">খুলুন</button><div id="lm2" class="empty"></div></div></div>

<button id="fab" aria-label="ক্যালকুলেটর">🧮</button>

<div class="keys" id="keys"></div>

</aside>
<script src="https://accounts.google.com/gsi/client" async defer onload="gReady()"></script>
<script>
var lday='',lmonth='all',pendingPic='',KEY='hishab-v1', db={entries:[]}, view='home', month=new Date().toISOString().slice(0,7);
try{var s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
function save(skip){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(!skip&&window.gQueue)gQueue()}
var T={income:['আয়','💰'],expense:['খরচ','🧾'],loan:['ধার–পাওনা','🤝'],saving:['সঞ্চয়','🐷'],market:['বাজার','🛒']};
var $=function(i){return document.getElementById(i)};
function tk(n){return '৳'+Number(n||0).toLocaleString('bn-BD')}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sum(t,f){return bookE().filter(function(e){return e.type===t&&(!f||f(e))}).reduce(function(a,e){return a+e.amt},0)}
function bal(f){return sum('income',f)-sum('expense',f)-sum('market',f)}
function render(){normalize();
 var h='';
 if(view==='home'){
  var b=bal();h+=bookBar();
  h+='<div class="bal"><small>বর্তমান ব্যালেন্স</small><div class="big'+(b<0?' neg':'')+'">'+tk(b)+'</div><div class="row3"><div>আয়<b>'+tk(sum('income'))+'</b></div><div>খরচ + বাজার<b>'+tk(sum('expense')+sum('market'))+'</b></div><div>সঞ্চয়<b>'+tk(sum('saving'))+'</b></div></div></div>'+limitCard()+zakatBanner()+'<div class="grid">';
  ['income','expense','loan','saving','market'].forEach(function(k){h+='<button class="tile" data-v="'+k+'"><span>'+T[k][1]+'</span><b>'+T[k][0]+'</b></button>'});
  h+='<button class="tile" data-v="month"><span>📅</span><b>মাসিক হিসাব</b></button><button class="tile wide" data-v="chart"><span>📋</span><b>সব <i class="cg">আয়</i>–<i class="cr">ব্যয়</i></b></button><button class="tile" data-v="notes"><span>📝</span><b>নোট</b></button><button class="tile" data-v="cash"><span>💵</span><b>নোটের হিসাব</b></button><button class="tile wide" data-v="zakat"><span>🕌</span><b>যাকাত হিসাব</b></button></div><div class="panel"><b>ডাটা ব্যাকআপ</b><button class="btn" id="exp">ব্যাকআপ ফাইল নামান</button><button class="btn" id="imp" style="background:var(--g2)">ফাইল থেকে ফিরিয়ে আনুন</button><input type="file" id="impf" accept=".json,application/json" hidden><div id="msg" class="empty"></div></div>';
 } else if(view==='books'){
  h+=hd('পেইজসমূহ')+booksHtml();
 } else if(view==='notes'){
  h+=hd('নোট')+notesHtml();
 } else if(view==='cash'){
  h+=hd('নোটের হিসাব')+cashHtml();
 } else if(view==='acct'){
  h+=hd('Google অ্যাকাউন্ট')+acctHtml();
 } else if(view==='set'){
  h+=hd('সেটিং')+setHtml();
 } else if(view==='zakat'){
  h+=hd('যাকাত হিসাব')+zakatHtml();
 } else if(view==='chart'){
  h+=hd('সব <i class="cg">আয়</i>–<i class="cr">ব্যয়</i>')+ledgerHtml();
 } else if(view==='month'){
  var f=function(e){return e.date.slice(0,7)===month};
  h+=hd('মাসিক হিসাব')+'<div class="panel"><label>মাস নির্বাচন</label><input type="month" id="mo" value="'+month+'">'+
  '<div class="sum"><span>আয়</span><b>'+tk(sum('income',f))+'</b></div><div class="sum"><span>খরচ</span><b>'+tk(sum('expense',f))+'</b></div><div class="sum"><span>বাজার</span><b>'+tk(sum('market',f))+'</b></div><div class="sum"><span>সঞ্চয়</span><b>'+tk(sum('saving',f))+'</b></div><div class="sum"><span>মাসের ব্যালেন্স</span><b>'+tk(bal(f))+'</b></div></div>'+limSet();
 } else {
  var k=view, isL=k==='loan', list=bookE().filter(function(e){return e.type===k}).sort(function(a,b){return b.date<a.date?-1:1});
  h+=hd(T[k][0]);if(isL&&lmid)h+=loanMsgHtml();
  if(isL){var p=sum('loan',function(e){return e.dir==='পাওনা'&&!e.done}),d=sum('loan',function(e){return e.dir==='ধার'&&!e.done});
   h+='<div class="panel"><div class="sum"><span>মোট পাওনা (পাব)</span><b>'+tk(p)+'</b></div><div class="sum"><span>মোট ধার (দেব)</span><b>'+tk(d)+'</b></div></div>'}
  else h+='<div class="panel"><div class="sum"><span>মোট '+T[k][0]+'</span><b>'+tk(sum(k))+'</b></div></div>';
  h+='<div class="panel">'+(isL?'<label>ধরন</label><select id="dir"><option>পাওনা</option><option>ধার</option></select>':'')+
  '<label>'+(isL?'ব্যক্তির নাম':'বিবরণ')+'</label><input id="note" placeholder="'+(isL?'যেমন: রহিম':'যেমন: বেতন')+'">'+
  '<label>পরিমাণ (টাকা)</label><input id="amt" type="number" inputmode="decimal" min="0"><small id="aw" style="color:var(--mut)"></small><label>তারিখ</label><input id="dt" type="date" value="'+new Date().toISOString().slice(0,10)+'"><label>পণ্যের ছবি (ঐচ্ছিক)</label><input id="pic" type="file" accept="image/*"><img id="prev" class="ph" alt="" hidden><button class="btn" id="add">যোগ করুন</button></div><div class="panel">';
  if(!list.length)h+='<div class="empty">এখনো কিছু যোগ করা হয়নি</div>';
  list.forEach(function(e){h+='<div class="item">'+(e.pic?'<img class="ph" src="'+e.pic+'" alt="">':'')+'<div style="flex:1">'+esc(e.note||'—')+'<small>'+(isL?e.dir+' · ':'')+e.date+'</small></div><div><span class="amt">'+tk(e.amt)+'</span> '+(isL?'<button class="chip" data-s="'+e.id+'">'+(e.done?'মিটেছে ✓':'বাকি')+'</button>'+(e.dir==='পাওনা'&&!e.done?'<button class="chip" data-lm="'+e.id+'" aria-label="বার্তা">✉️</button>':''):'')+(k==='income'?'<button class="chip" data-rc="'+e.id+'" aria-label="রসিদ">🧾</button>':'')+'<button class="x" data-d="'+e.id+'" aria-label="মুছুন">✕</button></div></div>'});
  h+='</div>';
 }
 $('app').innerHTML=h;$('app').style.marginTop='16px';var hs=$('hsub');if(hs){var cb=curBook();hs.textContent=cb.name+(cb.sub?' · '+cb.sub:'')}
}
function ledgerHtml(){
 var all=bookE().filter(function(e){return e.type==='income'||e.type==='expense'||e.type==='market'}),ms=[],h='',ti=0,te=0;
 all.forEach(function(e){var m=e.date.slice(0,7);if(ms.indexOf(m)<0)ms.push(m)});ms.sort().reverse();
 var l=ledgerList(all);
 h+='<div class="panel"><label>সময়</label><select id="lm"><option value="all">সব সময়</option>'+ms.map(function(m){return '<option value="'+m+'"'+(m===lmonth?' selected':'')+'>'+m+'</option>'}).join('')+'</select><label>নির্দিষ্ট দিন (ঐচ্ছিক)</label><input type="date" id="ld" value="'+lday+'"><button class="btn" id="pdf">PDF ডাউনলোড</button><div id="pm" class="empty"></div></div>';
 [['income','আয়','gi'],['out','খরচ','re']].forEach(function(s){
  var r=l.filter(function(e){return s[0]==='income'?e.type==='income':e.type!=='income'}),t=0;
  h+='<div class="panel led '+s[2]+'"><b class="lh">'+s[1]+'</b>';
  if(!r.length)h+='<div class="empty">কিছু নেই</div>';
  r.forEach(function(e){t+=e.amt;h+='<div class="item">'+(e.pic?'<img class="ph" src="'+e.pic+'" alt="">':'')+'<div style="flex:1">'+esc(e.note||'—')+'<small>'+(e.type==='market'?'বাজার · ':'')+e.date+'</small></div><span class="amt">'+tk(e.amt)+'</span><button class="x" data-d="'+e.id+'" aria-label="মুছুন">✕</button></div>'});
  h+='<div class="sum tot"><span>মোট '+s[1]+'</span><b>'+tk(t)+'</b></div></div>';
  if(s[0]==='income')ti=t;else te=t});
 return h+'<div class="panel"><div class="sum"><span>বাকি (আয় − খরচ)</span><b>'+tk(ti-te)+'</b></div></div>';
}
function exportData(){
 var n='hishab-backup-'+new Date().toISOString().slice(0,10)+'.json',d=JSON.stringify(db);
 var fb=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove()};
 if(window.claude&&claude.use){claude.use('downloads').then(function(x){if(x)x.save({filename:n,data:d}).catch(function(){});else fb()},fb)}else fb()
}
function importData(f){
 var r=new FileReader();
 r.onload=function(){var n=0,ok=false;
  try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.entries))throw 0;
   var ids={};db.entries.forEach(function(e){ids[e.id]=1});

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function getSet(){try{return JSON.parse(lsGet('hishab-set'))||{}}catch(e){return {}}}
function applySet(){
 var s=getSet(),r=document.documentElement;
 if(s.ac&&s.ac!=='green')r.setAttribute('data-accent',s.ac);else r.removeAttribute('data-accent');
 if(s.md==='light'||s.md==='dark')r.setAttribute('data-theme',s.md);else if(T0)r.setAttribute('data-theme',T0);else r.removeAttribute('data-theme');
}
function setAc(a){var s=getSet();s.ac=a;lsSet('hishab-set',JSON.stringify(s));applySet();render()}
function setMd(m){var s=getSet();s.md=m;lsSet('hishab-set',JSON.stringify(s));applySet()}
function hashPw(p){
 var salt='hishab:'+p;
 if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')});
 var h=5381;for(var i=0;i<salt.length;i++)h=((h<<5)+h+salt.charCodeAt(i))|0;return Promise.resolve('f'+h);
}

/* যাকাত */
var ZF=[['cash','নগদ টাকা (নোটের হিসাব থেকে)'],['bank','ব্যাংক / সঞ্চয়'],['goldW','সোনা (ভরি)'],['goldP','সোনার দাম (প্রতি ভরি)'],['silW','রুপা (ভরি)'],['silP','রুপার দাম (প্রতি ভরি)'],['biz','ব্যবসার পণ্যের মূল্য'],['recv','পাওনা (পাওয়ার নিশ্চিত)'],['debt','ঋণ (পরিশোধযোগ্য)']];
function zv(k){
 var z=cf().z||{};if(z[k]!==undefined&&z[k]!=='')return z[k];
 if(k==='cash')return cashTot().a;if(k==='bank')return sum('saving');
 if(k==='recv')return sum('loan',function(e){return e.dir==='পাওনা'&&!e.done});
 if(k==='debt')return sum('loan',function(e){return e.dir==='ধার'&&!e.done});
 return '';
}
function zres(){
 var n=function(k){return +zv(k)||0},sp=n('silP'),tot=n('cash')+n('bank')+n('goldW')*n('goldP')+n('silW')*sp+n('biz')+n('recv')-n('debt'),nis=52.5*sp;
 return {tot:tot,nis:nis,sp:sp,z:(sp>0&&tot>=nis)?tot*0.025:0};
}
function zout(){
 var r=zres();
 if(!r.sp)return '<div class="cmp">নিসাব বের করতে রুপার দাম (প্রতি ভরি) দিন</div>';
 return '<div class="sum"><span>মোট সম্পদ (ঋণ বাদে)</span><b>'+tk(r.tot)+'</b></div><div class="sum"><span>নিসাব (৫২.৫ ভরি রুপার দাম)</span><b>'+tk(r.nis)+'</b></div>'+(r.tot>=r.nis?'<div class="sum tot"><span>যাকাত (২.৫%)</span><b style="color:var(--inc);font-size:20px">'+tk(r.z)+'</b></div>':'<div class="cmp">মোট সম্পদ নিসাবের চেয়ে কম</div>');
}
function zakatHtml(){
 var h='<div class="panel"><b>যাকাত হিসাব</b><small style="color:var(--mut);display:block">নগদ, সঞ্চয়, পাওনা ও ঋণ এই পেইজের হিসাব থেকে আগে বসানো আছে, বদলানো যায়। সোনা ও রুপার দাম আপনি নিজে দিন।</small>';
 ZF.forEach(function(f){h+='<label>'+f[1]+'</label><input type="number" inputmode="decimal" min="0" data-z="'+f[0]+'" value="'+zv(f[0])+'">'});
 h+='<label>যাকাতের বার্ষিক তারিখ (বছর পূর্তি)</label><input type="date" data-z="date" value="'+esc((cf().z||{}).date||'')+'"><small style="color:var(--mut)">এই তারিখের কাছাকাছি হোমে মনে করিয়ে দেওয়া হবে।</small></div>';
 h+='<div class="panel" id="zout">'+zout()+'</div><div class="panel"><small style="color:var(--mut)">এটি সাধারণ হিসাবের সহায়ক। নিসাব এখানে ৫২.৫ ভরি রুপার দামে ধরা হয়েছে। বিস্তারিত মাসআলার জন্য আলেমের পরামর্শ নিন।</small></div>';
 return h;
}
function zakatBanner(){
 var d=(cf().z||{}).date;if(!d)return '';
 var t=new Date(),td=new Date(t.getFullYear(),t.getMonth(),t.getDate()),p=d.split('-'),df=null;
 [t.getFullYear()-1,t.getFullYear(),t.getFullYear()+1].forEach(function(y){var x=Math.round((new Date(y,+p[1]-1,+p[2])-td)/864e5);if(x>=-15&&x<=7)df=x});

}
/* রসিদ (PDF) */
function receipt(id){
 var e=db.entries.filter(function(x){return x.id===id})[0];if(!e)return;
 var c=cf();if(!e.rno){c.rc=(c.rc||0)+1;e.rno=c.rc;save()}
 var cb=curBook(),S=2,W=595*S,H=842*S,cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
 function f(sz,w){x.font=(w||400)+' '+(sz*S)+'px "Hind Siliguri","Noto Sans Bengali",sans-serif'}
 function tx(t,px,py,sz,w,col,al){f(sz,w);x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,px,py)}
 function wrap(t,px,py,sz,mw,col){f(sz,400);x.fillStyle=col;x.textAlign='left';var ws=t.split(' '),ln='',yy=py;ws.forEach(function(w){var tt=ln?ln+' '+w:w;if(x.measureText(tt).width>mw&&ln){x.fillText(ln,px,yy);yy+=(sz+8)*S;ln=w}else ln=tt});x.fillText(ln,px,yy);return yy}
 Promise.all([document.fonts.load('400 16px "Hind Siliguri"'),document.fonts.load('700 16px "Hind Siliguri"')]).catch(function(){}).then(function(){
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  var L=54*S,R=W-54*S;
  tx(cb.name,W/2,82*S,22,700,'#17603c','center');
  if(cb.sub)tx(cb.sub,W/2,106*S,13,400,'#5d7066','center');
  tx('টাকা প্রাপ্তির রসিদ',W/2,142*S,18,700,'#14261c','center');
  tx('রসিদ নং: '+bn(e.rno),L,184*S,14,600,'#14261c');
  tx('তারিখ: '+bd(e.date),R,184*S,14,600,'#14261c','right');
  var yy=wrap('প্রাপ্তি / বিবরণ: '+(e.note||'—'),L,220*S,14,R-L,'#14261c');
  tx('টাকার পরিমাণ: '+tk(e.amt),L,yy+36*S,17,700,'#1f7a4d');
  yy=wrap('কথায়: '+words2(e.amt),L,yy+70*S,14,R-L,'#14261c');
  tx('গ্রহীতার স্বাক্ষর: ______________',R,yy+70*S,13,400,'#5d7066','right');
  x.strokeStyle='#17603c';x.lineWidth=3*S;x.strokeRect(38*S,40*S,W-76*S,yy+100*S-40*S);
  var u=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),b=new Uint8Array(u.length);for(var i=0;i<u.length;i++)b[i]=u.charCodeAt(i);
  saveFile('roshid-'+e.rno+'.pdf',mkPdf([b],W,H),'application/pdf',function(){});
 });
}

/* ক্যালকুলেটর */
var ex='';
['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','=','0','.','(',')'].forEach(function(k){
 var b=document.createElement('button');b.textContent=k;
 if('÷×−+='.indexOf(k)>-1||k==='C'||k==='⌫')b.className='op';
 b.onclick=function(){press(k)};$('keys').appendChild(b)});
function calc(s){var j=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
 if(!/^[0-9+\-*\/.() ]+$/.test(j))return null;try{var r=Function('"use strict";return ('+j+')')();return isFinite(r)?Math.round(r*1e6)/1e6:null}catch(e){return null}}
function press(k){
 if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);
 else if(k==='='){var r=calc(ex);if(r!==null)ex=String(r)}
 else ex+=k;
 $('ex').textContent=ex;var r2=calc(ex);$('out').textContent=r2===null?(ex?'…':'0'):r2.toLocaleString('bn-BD')}
$('fab').onclick=function(){$('calc').classList.toggle('on')};
$('use').onclick=function(){var r=calc(ex),a=$('amt');if(r!==null&&a){a.value=r;a.dispatchEvent(new Event('input',{bubbles:true}));a.focus()}};
